<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3fa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Private Scanner</title>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#121826; --muted:#5d6676; --line:#dfe3ea;
  --accent:#1b3fa0; --accent-ink:#fff; --accent-soft:#e6ecfb; --danger:#c62828; --ok:#1f7a45;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding-top:var(--safe-t)}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:700}
.top h2{font-size:17px;margin:0;flex:1;font-weight:600;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--ink)}
.iconbtn:active{background:var(--line)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.body{flex:1;overflow:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.bottom{padding:12px 16px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{min-height:56px;border-radius:var(--r);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:active{filter:brightness(.9)}
.btn.secondary{background:var(--card);border:1.5px solid var(--line)}
.btn.secondary:active{background:var(--line)}
.btn.big{min-height:76px;font-size:21px;border-radius:20px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row .btn{white-space:nowrap;padding:0 10px;font-size:17px}
.link{color:var(--accent);font-weight:600;padding:12px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
/* home */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 20px}
.hero svg{align-self:center;margin-bottom:8px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);border:1px solid var(--line)}
/* crop */
#crop{background:#111;color:#fff}
#crop .top h2{color:#fff;font-size:16px;font-weight:500}
#crop .iconbtn{color:#fff}
#crop .bottom{background:#111}
#crop .btn.secondary{background:#2a2d33;border-color:#3a3e46;color:#fff}
#stage{flex:1;position:relative;touch-action:none;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0}
#overlay{position:absolute;inset:0;width:100%;height:100%}
#overlay polygon{fill:rgba(64,120,255,.18);stroke:#5b8cff;stroke-width:2.5}
#overlay .h{fill:#fff;stroke:#5b8cff;stroke-width:3}
#overlay .hit{fill:transparent}
#loupe{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.5);overflow:hidden;display:none;pointer-events:none}
#loupe canvas{position:static}
/* review */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thumb{position:relative;background:var(--card);border-radius:12px;border:1px solid var(--line);aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;padding:6px}
.thumb img{max-width:100%;max-height:100%;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.thumb .n{position:absolute;left:8px;top:8px;background:rgba(18,24,38,.75);color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px}
.thumb .spin{width:28px;height:28px}
.fname{font-size:13px;color:var(--muted);text-align:center;word-break:break-all}
/* done */
.donebox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0 24px;text-align:center}
.donebox .ic{width:84px;height:84px;border-radius:50%;background:#e3f3e9;display:grid;place-items:center}
.donebox h1{margin:6px 0 0;font-size:26px}
.donebox p{margin:0;color:var(--muted)}
/* drive */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acct b{word-break:break-all}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.item .info{flex:1 1 100%;min-width:0}
.item .opn{margin-left:auto}
.item .nm{font-weight:600;font-size:15px;word-break:break-all}
.item .meta{font-size:13px;color:var(--muted)}
.item .act{min-height:44px;padding:0 12px;border-radius:12px;font-weight:600;font-size:15px}
.item .del{color:var(--danger);background:#fbeaea}
.item .opn{color:var(--accent);background:var(--accent-soft)}
/* overlays */
#busy{position:fixed;inset:0;background:rgba(18,24,38,.55);display:none;align-items:center;justify-content:center;z-index:50}
#busy.on{display:flex}
#busy .box{background:var(--card);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:80%;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sheetWrap{position:fixed;inset:0;background:rgba(18,24,38,.45);display:none;align-items:flex-end;z-index:40}
#sheetWrap.on{display:flex}
#sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:10px}
#sheet h3{margin:4px 0 6px;text-align:center;font-size:17px}
#sheet p{margin:0 0 6px;text-align:center;color:var(--muted);font-size:15px}
#toast{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translateX(-50%);background:#121826;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;display:none;max-width:88%;text-align:center}
#toast.on{display:block}
input[type=file]{display:none}
/* live camera */
#live{background:#000;color:#fff;padding-top:0}
#live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#liveOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#liveOverlay polygon{fill:rgba(61,220,132,.16);stroke:#3ddc84;stroke-width:3.5;stroke-linejoin:round}
#liveOverlay polygon.done{fill:rgba(255,255,255,.08);stroke:#fff;stroke-dasharray:10 8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#flash.on{opacity:.85;transition:none}
#live .lt{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 8px) 12px 18px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#live .hint{flex:1;text-align:center;font-weight:600;font-size:16px;text-shadow:0 1px 4px #000}
#live .iconbtn{color:#fff}
.autobtn{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:14px}
.autobtn.on{background:#3ddc84;color:#06301a}
#live .lb{position:absolute;left:0;right:0;bottom:0;padding:22px 22px calc(20px + var(--safe-b));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.shutter{width:80px;height:80px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;background:transparent}
.shutter::after{content:'';width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active::after{transform:scale(.88)}
.lthumb{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;overflow:visible;display:grid;place-items:center;color:#fff;font-weight:700}
.lthumb img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.lthumb .c{position:absolute;right:-8px;top:-8px;background:#3ddc84;color:#06301a;border-radius:999px;min-width:26px;height:26px;font-size:14px;display:grid;place-items:center;padding:0 6px}
.ldone{min-width:72px;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;padding:0 16px;font-size:17px}
.ldone[hidden],.lthumb[hidden]{visibility:hidden;display:grid}
/* library */
.libitem{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.libitem img{width:52px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none;background:#fff}
.libitem .nm{font-weight:600;font-size:15px;word-break:break-all}
.libitem .meta{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin:4px 6px 0 0;background:#e3f3e9;color:var(--ok)}
.badge.d{background:var(--accent-soft);color:var(--accent)}
.field{font:inherit;font-size:18px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;width:100%;margin-top:-6px}
.field:focus{outline:none;border-color:var(--accent)}
.count{background:var(--accent);color:#fff;border-radius:999px;font-size:14px;padding:1px 9px;margin-left:4px}
/* swipe rows */
.swrow{position:relative;overflow:hidden;border-radius:14px;flex:none}
.swrow .sa{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;color:#fff;font-weight:700;font-size:16px;border:0}
.swrow .sa.l{left:0;background:var(--accent);justify-content:flex-start;padding-left:20px}
.swrow .sa.r{right:0;background:var(--danger);justify-content:flex-end;padding-right:20px}
.swrow .fg{position:relative;transition:transform .2s ease;touch-action:pan-y;will-change:transform}
.swrow .fg.drag{transition:none}
.swhint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}
#undoBar{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));background:#121826;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:10px;z-index:45;font-size:15px}
#undoBar.on{display:flex}
#undoBar span{flex:1}
#undoBar button{color:#8fb0ff;font-weight:700;padding:10px 12px}
#viewBody img{width:100%;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
</style>
</head>
<body>

<input id="cam" type="file" accept="image/*" capture="environment">
<input id="gallery" type="file" accept="image/*">

<!-- HOME -->
<section id="home" class="screen">
  <div class="top">
    <h1 data-t="appName"></h1>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="uk">УКР</button></div>
  </div>
  <div class="hero">
    <img src="icons/home.png" alt="" width="150" height="150" style="align-self:center;border-radius:34px;box-shadow:0 6px 20px rgba(18,24,38,.12);margin-bottom:8px">
    <button id="btnScan" class="btn primary big">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
      <span data-t="scan"></span>
    </button>
    <button id="btnGallery" class="link" data-t="fromPhotos"></button>
    <button id="btnLibrary" class="btn secondary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      <span data-t="myScans"></span><span class="count" id="libCount" style="display:none"></span>
    </button>
    <button id="btnMyDrive" class="btn secondary" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-t="myDrive"></span>
    </button>
  </div>
  <div class="bottom">
    <div class="note">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span data-t="privacyNote"></span>
    </div>
  </div>
</section>

<!-- CROP -->
<section id="crop" class="screen">
  <div class="top">
    <button class="iconbtn" id="cropClose" aria-label="close">✕</button>
    <h2 data-t="cropTitle"></h2>
    <span style="width:44px"></span>
  </div>
  <div id="stage">
    <canvas id="cropCanvas"></canvas>
    <svg id="overlay"></svg>
    <div id="loupe"><canvas id="loupeCanvas" width="240" height="240" style="width:120px;height:120px"></canvas></div>
  </div>
  <div class="bottom">
    <div class="row">
      <button id="cropRetake" class="btn secondary" data-t="retake"></button>
      <button id="cropFull" class="btn secondary" data-t="fullPhoto"></button>
    </div>
    <button id="cropNext" class="btn primary" data-t="useThis"></button>
  </div>
</section>

<!-- LIVE CAMERA -->
<section id="live" class="screen">
  <video id="vid" playsinline muted autoplay></video>
  <svg id="liveOverlay"></svg>
  <div id="flash"></div>
  <div class="lt">
    <button class="iconbtn" id="liveClose" aria-label="close">✕</button>
    <div class="hint" id="liveHint"></div>
    <button class="autobtn" id="autoBtn"></button>
  </div>
  <div class="lb">
    <button class="lthumb" id="liveThumb" hidden></button>
    <button class="shutter" id="shutter" aria-label="take photo"></button>
    <button class="ldone" id="liveDone" data-t="done" hidden></button>
  </div>
</section>

<!-- MY SCANS ON THIS PHONE -->
<section id="library" class="screen">
  <div class="top">
    <button class="iconbtn" id="libBack" aria-label="back">‹</button>
    <h2 data-t="myScans"></h2>
    <span style="width:44px"></span>
  </div>
  <div class="body">
    <p class="small muted" style="margin:0 0 12px" data-t="libNote"></p>
    <div class="list" id="libList" style="margin-top:0"></div>
    <p class="swhint" data-t="swipeHint"></p>
  </div>
</section>

<!-- VIEW A SAVED SCAN -->
<section id="viewer" class="screen">
  <div class="top">
    <button class="iconbtn" id="viewBack" aria-label="back">‹</button>
    <h2 id="viewTitle" style="font-size:15px"></h2>
    <span style="width:44px"></span>
  </div>
  <div class="body" id="viewBody" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="bottom">
    <div class="row">
      <button id="viewEdit" class="btn secondary" data-t="edit"></button>
      <button id="viewSend" class="btn primary" data-t="send"></button>
    </div>
  </div>
</section>

<!-- REVIEW -->
<section id="review" class="screen">
  <div class="top">
    <button class="iconbtn" id="revClose" aria-label="close">✕</button>
    <h2 id="revTitle"></h2>
    <button class="link" id="revDone" style="padding:10px 6px" data-t="done"></button>
  </div>
  <div class="body">
    <div class="seg" id="filterSeg">
      <button data-f="bw" data-t="filterBW"></button>
      <button data-f="gray" data-t="filterGray"></button>
      <button data-f="color" data-t="filterColor"></button>
      <button data-f="original" data-t="filterOriginal"></button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="bottom">
    <button id="btnAddPage" class="btn secondary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-t="addPage"></span>
    </button>
    <div class="row">
      <button id="btnSend" class="btn primary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        <span data-t="send"></span>
      </button>
      <button id="btnSave" class="btn primary" style="display:none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5 12 11l2.5 2.5"/></svg>
        <span data-t="saveDrive"></span>
      </button>
    </div>
    <div class="fname" id="fname"></div>
  </div>
</section>

<!-- DONE -->
<section id="done" class="screen">
  <div class="donebox">
    <div class="ic" id="doneIc"></div>
    <h1 id="doneTitle"></h1>
    <p id="doneNote"></p>
    <p class="small" id="doneErase"></p>
  </div>
  <div class="bottom">
    <div class="row">
      <button id="doneSend" class="btn secondary" data-t="send"></button>
      <button id="doneSave" class="btn secondary" data-t="saveDrive"></button>
    </div>
    <button id="doneNew" class="btn primary" data-t="newScan"></button>
    <button id="doneDrive" class="link" data-t="myDrive"></button>
  </div>
</section>

<!-- DRIVE -->
<section id="drive" class="screen">
  <div class="top">
    <button class="iconbtn" id="driveBack" aria-label="back">‹</button>
    <h2 data-t="myDrive"></h2>
    <button class="iconbtn" id="driveRefresh" aria-label="refresh">↻</button>
  </div>
  <div class="body">
    <div class="card">
      <div class="acct"><span class="muted small" data-t="savingAs"></span><b id="acctName"></b>
        <button class="link" id="btnChange" style="padding:6px 0;margin-left:auto;font-size:15px" data-t="changePerson"></button></div>
      <p class="small muted" style="margin:8px 0 0" data-t="autoDelete"></p>
    </div>
    <div class="list" id="driveList"></div>
    <p class="swhint" data-t="swipeHint"></p>
    <button id="btnDeleteAll" class="btn secondary danger" style="margin-top:16px;width:100%;display:none" data-t="deleteAll"></button>
  </div>
</section>

<!-- ONE-TIME FAMILY SETUP -->
<section id="setup" class="screen">
  <div class="top">
    <button class="iconbtn" id="setupBack" aria-label="back">‹</button>
    <h2 data-t="familyDrive"></h2>
    <span style="width:44px"></span>
  </div>
  <div class="body">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <p style="margin:0" data-t="setupNote"></p>
      <label class="small muted" for="inName" data-t="yourName"></label>
      <input id="inName" class="field" autocomplete="given-name" autocapitalize="words" maxlength="40">
      <label class="small muted" for="inCode" data-t="familyCode"></label>
      <input id="inCode" class="field" inputmode="numeric" autocomplete="off" autocapitalize="off" maxlength="20">
      <div id="setupErr" class="small" style="color:var(--danger);min-height:1em"></div>
      <button id="btnRegister" class="btn primary" data-t="connect"></button>
    </div>
  </div>
</section>

<div id="busy"><div class="box"><div class="spin"></div><div id="busyText"></div></div></div>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="toast"></div>
<div id="undoBar"><span id="undoText"></span><button id="undoBtn"></button></div>

<script src="lib/jspdf.umd.min.js"></script>
<script>
'use strict';
/* =========================================================
   SETTINGS
   ========================================================= */

async function blobToCanvas(blob,max){
  const url=URL.createObjectURL(blob);
  try{const img=await loadImg(url);let w=img.naturalWidth,h=img.naturalHeight;const s=max?Math.min(1,max/Math.max(w,h)):1;
    const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);

  finally{URL.revokeObjectURL(url);}

/* =========================================================
   SCANNER ENGINE (OpenCV, runs only on this phone)
   ========================================================= */
let cvState='idle';
function loadCv(){
  if(cvState!=='idle')return;cvState='loading';
  const s=document.createElement('script');s.src='lib/opencv.js';s.async=true;
  s.onload=()=>{const w=window.cv;if(w&&typeof w.then==='function'&&!w.Mat&&w instanceof Promise){w.then(m=>{window.cv=m;});}};
  s.onerror=()=>{cvState='failed';};
  document.head.appendChild(s);
}
async function cvReady(){
  loadCv();
  const start=Date.now();
  while(Date.now()-start<45000){
    if(window.cv&&window.cv.Mat&&window.cv.getPerspectiveTransform){cvState='ready';return true;}
    if(cvState==='failed')return false;
    await sleep(100);
  }
  return false;
}
async function needCv(){
  if(window.cv&&window.cv.Mat)return true;
  busy(true,t('loadingEngine'));const ok=await cvReady();busy(false);
  if(!ok){toast(t('engineFailed'));cvState='idle';}
  return ok;
}
function orderQuad(p){
  const s=p.map(q=>q[0]+q[1]),d=p.map(q=>q[1]-q[0]);
  return [p[s.indexOf(Math.min(...s))],p[d.indexOf(Math.min(...d))],p[s.indexOf(Math.max(...s))],p[d.indexOf(Math.max(...d))]];
}
function defaultQuad(w,h,inset=0.04){const x=w*inset,y=h*inset;return [[x,y],[w-x,y],[w-x,h-y],[x,h-y]];}
function detectQuad(canvas){return findQuad(canvas)||defaultQuad(canvas.width,canvas.height);}
function findQuad(canvas,fast){
  const cv=window.cv,W=canvas.width,H=canvas.height,s=Math.min(1,640/Math.max(W,H));
  const sc=document.createElement('canvas');sc.width=Math.round(W*s);sc.height=Math.round(H*s);
  sc.getContext('2d').drawImage(canvas,0,0,sc.width,sc.height);
  const area=sc.width*sc.height,mats=[];const M=m=>(mats.push(m),m);
  const src=M(cv.imread(sc)),gray=M(new cv.Mat());
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
  function find(bin,mode){
    const cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(bin,cs,hi,mode,cv.CHAIN_APPROX_SIMPLE);
    let best=null,bestA=0;
    for(let i=0;i<cs.size();i++){
      const c=cs.get(i),a=cv.contourArea(c);
      const br_=(a>area*0.12&&a<area*0.985&&a>bestA)?cv.boundingRect(c):null;
      const spans=br_&&((br_.x<=3&&br_.x+br_.width>=sc.width-3)||(br_.y<=3&&br_.y+br_.height>=sc.height-3));
      if(br_&&!spans){
        const per=cv.arcLength(c,true);
        for(const e of [0.02,0.03,0.045,0.06,0.08]){
          const ap=new cv.Mat();cv.approxPolyDP(c,ap,e*per,true);
          if(ap.rows===4&&cv.isContourConvex(ap)){const pts=[];for(let k=0;k<4;k++)pts.push([ap.data32S[k*2],ap.data32S[k*2+1]]);ap.delete();best=pts;bestA=a;break;}
          ap.delete();
        }
      }
      c.delete();
    }
    cs.delete();hi.delete();return best;
  }
  let q=null;
  try{
    const k3=M(cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(3,3)));
    for(const [a,b] of (fast?[[30,100]]:[[40,120],[20,70],[75,200]])){
      const ed=M(new cv.Mat());cv.Canny(gray,ed,a,b);cv.dilate(ed,ed,k3);
      q=find(ed,cv.RETR_LIST);if(q)break;
    }
    if(!q){
      const th=M(new cv.Mat());cv.threshold(gray,th,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
      const k9=M(cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(9,9)));cv.morphologyEx(th,th,cv.MORPH_CLOSE,k9);
      q=find(th,cv.RETR_EXTERNAL);
    }
  }catch(e){console.warn('detect',e);q=null;}
  mats.forEach(m=>{try{m.delete();}catch(e){}});
  if(!q)return null;
  const o=orderQuad(q.map(p=>[p[0]/s,p[1]/s])),cx=o.reduce((a,p)=>a+p[0],0)/4,cy=o.reduce((a,p)=>a+p[1],0)/4;
  return o.map(p=>[p[0]+(cx-p[0])*0.012,p[1]+(cy-p[1])*0.012]); // pull in slightly so the table edge does not show
}
function estimateBg(cv,m){
  const small=new cv.Mat(),k=cv.getStructuringElement(cv.MORPH_ELLIPSE,new cv.Size(7,7)),bg=new cv.Mat();
  cv.resize(m,small,new cv.Size(Math.max(8,Math.round(m.cols/4)),Math.max(8,Math.round(m.rows/4))),0,0,cv.INTER_AREA);
  cv.dilate(small,small,k);cv.medianBlur(small,small,15);
  cv.resize(small,bg,new cv.Size(m.cols,m.rows),0,0,cv.INTER_LINEAR);
  small.delete();k.delete();return bg;
}
function levels(m,lo,hi){const a=255/(hi-lo);m.convertTo(m,-1,a,-lo*a);}
// make thin, faint pen and print strokes thicker and darker
function inkBolder(cv,m,px){if(!px)return;const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(px+1,px+1));cv.erode(m,m,k);k.delete();}
function sharpen(cv,m,amt,sigma){const b=new cv.Mat();cv.GaussianBlur(m,b,new cv.Size(0,0),sigma||1.4);cv.addWeighted(m,1+amt,b,-amt,0,m);b.delete();}
function renderPage(srcCanvas,quad,rot,filter){
  const cv=window.cv,[tl,tr,br,bl]=quad;
  let W=(dist(br,bl)+dist(tr,tl))/2,H=(dist(tr,br)+dist(tl,bl))/2;
  // photos taken at an angle distort the shape; snap to a standard paper shape when close (Letter, A4, ID card, Legal)
  {const r=Math.max(W,H)/Math.min(W,H);let best=null,bd=0.1;
   for(const c of [11/8.5,297/210,85.6/53.98,14/8.5]){const d=Math.abs(r-c)/c;if(d<bd){bd=d;best=c;}}
   if(best){if(H>=W)H=W*best;else W=H*best;}}
  const s=MAX_OUT/Math.max(W,H);W=Math.max(16,Math.round(W*s));H=Math.max(16,Math.round(H*s)); // always a full-size page, like a real scanner
  const src=cv.imread(srcCanvas),dst=new cv.Mat();
  const from=cv.matFromArray(4,1,cv.CV_32FC2,[tl[0],tl[1],tr[0],tr[1],br[0],br[1],bl[0],bl[1]]);
  const to=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);
  const Mx=cv.getPerspectiveTransform(from,to);
  cv.warpPerspective(src,dst,Mx,new cv.Size(W,H),cv.INTER_CUBIC,cv.BORDER_REPLICATE,new cv.Scalar());
  src.delete();from.delete();to.delete();Mx.delete();
  let out=new cv.Mat();
  if(filter==='bw'||filter==='clean'){            // black & white, like an office scanner
    cv.cvtColor(dst,out,cv.COLOR_RGBA2GRAY);const bg=estimateBg(cv,out);
    cv.divide(out,bg,out,255);bg.delete();
    cv.GaussianBlur(out,out,new cv.Size(3,3),0);sharpen(cv,out,1.6,1.3);inkBolder(cv,out,FILTER.ink);levels(out,FILTER.bw[0],FILTER.bw[1]);
  }else if(filter==='gray'){                       // grayscale with strong contrast
    cv.cvtColor(dst,out,cv.COLOR_RGBA2GRAY);const bg=estimateBg(cv,out);
    cv.divide(out,bg,out,255);bg.delete();sharpen(cv,out,1.2,1.3);inkBolder(cv,out,1);levels(out,FILTER.gray[0],FILTER.gray[1]);
  }else if(filter==='color'){                      // color with white paper
    cv.cvtColor(dst,out,cv.COLOR_RGBA2RGB);const bg=estimateBg(cv,out);
    cv.divide(out,bg,out,255);bg.delete();sharpen(cv,out,0.7,1.4);levels(out,FILTER.color[0],FILTER.color[1]);
  }else{cv.cvtColor(dst,out,cv.COLOR_RGBA2RGB);sharpen(cv,out,0.4,1.2);}
  dst.delete();
  if(rot){const r=new cv.Mat();cv.rotate(out,r,[cv.ROTATE_90_CLOCKWISE,cv.ROTATE_180,cv.ROTATE_90_COUNTERCLOCKWISE][rot-1]);out.delete();out=r;}
  const c=document.createElement('canvas');cv.imshow(c,out);out.delete();return c;
}

async function onPhoto(file){
  if(!file)return;
  busy(true,t('detecting'));
  let canvas;
  try{canvas=await blobToCanvas(file,MAX_SRC);}catch(e){busy(false);toast(t('noPhoto'));return;}
  const blob=await canvasToBlob(canvas,0.92);
  busy(false);
  if(!await needCv())return;
  busy(true,t('detecting'));await sleep(30);
  let quad;try{quad=detectQuad(canvas);}catch(e){quad=defaultQuad(canvas.width,canvas.height);}
  busy(false);
  cropCtx={canvas,blob,quad,replace:captureFor?captureFor.replace:null,editIndex:null};
  if(!doc.created)doc.created=new Date();
  openCrop();
}

function layoutCrop(){
  if(!cropCtx)return;
  const st=$('stage'),r=st.getBoundingClientRect(),c=cropCtx.canvas,padd=22;
  const s=Math.min((r.width-padd*2)/c.width,(r.height-padd*2)/c.height);
  view={s,ox:(r.width-c.width*s)/2,oy:(r.height-c.height*s)/2};
  const cc=$('cropCanvas'),dpr=Math.min(2,window.devicePixelRatio||1);
  cc.width=Math.round(c.width*s*dpr);cc.height=Math.round(c.height*s*dpr);
  cc.style.width=c.width*s+'px';cc.style.height=c.height*s+'px';cc.style.left=view.ox+'px';cc.style.top=view.oy+'px';
  cc.getContext('2d').drawImage(c,0,0,cc.width,cc.height);
  drawOverlay();
}
function toScreen(p){return [view.ox+p[0]*view.s,view.oy+p[1]*view.s];}
function drawOverlay(){
  const q=cropCtx.quad.map(toScreen),svg=$('overlay');
  let h=`<polygon points="${q.map(p=>p.join(',')).join(' ')}"/>`;
  q.forEach((p,i)=>{h+=`<circle class="h" cx="${p[0]}" cy="${p[1]}" r="13"/><circle class="hit" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="34"/>`;});
  svg.innerHTML=h;
}
function stagePoint(e){const r=$('stage').getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
$('overlay').addEventListener('pointerdown',e=>{
  const sp=stagePoint(e);let bi=-1,bd=60;
  cropCtx.quad.map(toScreen).forEach((p,i)=>{const d=dist(p,sp);if(d<bd){bd=d;bi=i;}});
  if(bi<0)return;
  e.preventDefault();$('overlay').setPointerCapture(e.pointerId);
  const p=toScreen(cropCtx.quad[bi]);drag={i:bi,dx:p[0]-sp[0],dy:p[1]-sp[1]};moveLoupe(sp);
});
$('overlay').addEventListener('pointermove',e=>{
  if(!drag)return;e.preventDefault();
  const sp=stagePoint(e),c=cropCtx.canvas;
  let x=(sp[0]+drag.dx-view.ox)/view.s,y=(sp[1]+drag.dy-view.oy)/view.s;
  x=Math.max(0,Math.min(c.width,x));y=Math.max(0,Math.min(c.height,y));
  cropCtx.quad[drag.i]=[x,y];drawOverlay();moveLoupe(toScreen([x,y]));
});
function endDrag(){drag=null;$('loupe').style.display='none';}
$('overlay').addEventListener('pointerup',endDrag);$('overlay').addEventListener('pointercancel',endDrag);
function moveLoupe(sp){
  const L=$('loupe'),st=$('stage').getBoundingClientRect();
  let lx=sp[0]-60,ly=sp[1]-160;if(ly<4)ly=sp[1]+50;lx=Math.max(4,Math.min(st.width-124,lx));
  L.style.left=lx+'px';L.style.top=ly+'px';L.style.display='block';
  const lc=$('loupeCanvas'),g=lc.getContext('2d'),c=cropCtx.canvas;
  const ix=(sp[0]-view.ox)/view.s,iy=(sp[1]-view.oy)/view.s,span=60/view.s/2;
  g.fillStyle='#000';g.fillRect(0,0,240,240);
  g.drawImage(c,ix-span,iy-span,span*2,span*2,0,0,240,240);
  g.strokeStyle='#5b8cff';g.lineWidth=3;g.beginPath();g.moveTo(120,96);g.lineTo(120,144);g.moveTo(96,120);g.lineTo(144,120);g.stroke();
}

/* ---------- processing pages ---------- */
async function processPage(p,gen){
  const canvas=await blobToCanvas(p.src);
  if(gen!==doc.gen)return;
  const out=renderPage(canvas,p.quad,p.rot,doc.filter);
  const blob=await canvasToBlob(out,doc.filter==='original'?0.85:0.8);
  if(gen!==doc.gen)return;
  if(p.thumb)URL.revokeObjectURL(p.thumb);
  p.out=blob;p.w=out.width;p.h=out.height;p.thumb=URL.createObjectURL(blob);
}
let working=null;
function changed(){doc.pdf=null;doc.gen++;renderReview();if(!working)working=runQueue();}
async function runQueue(){
  try{
    while(true){
      while(cur==='live')await sleep(250); // keep the camera smooth; finish pages after Done
      const gen=doc.gen;
      if(!await cvReady())break;
      const p=doc.pages.find(x=>!x.out);
      if(p){await sleep(16);await processPage(p,gen);if(gen===doc.gen)renderReview();continue;}
      if(!doc.pdf&&doc.pages.length){await buildPdf(gen);if(gen===doc.gen)renderReview();continue;}
      break;
    }
  }catch(e){console.error(e);}
  working=null;
}
async function makePdf(pages,title){
  const {jsPDF}=window.jspdf;let pdf=null;
  for(const p of pages){
    const pw=612,ph=Math.round(612*p.h/p.w),o=pw>ph?'l':'p';
    if(!pdf)pdf=new jsPDF({orientation:o,unit:'pt',format:[pw,ph],compress:true});else pdf.addPage([pw,ph],o);
    pdf.addImage(new Uint8Array(await p.blob.arrayBuffer()),'JPEG',0,0,pw,ph,undefined,'NONE');
  }
  if(!pdf)return null;
  pdf.setProperties({title,creator:t('appName')});
  return pdf.output('blob');
}
async function buildPdf(gen){
  if(!doc.pages.length||doc.pages.some(p=>!p.out))return;
  const name=doc.customName||fileName(doc.created);
  const blob=await makePdf(doc.pages.map(p=>({blob:p.out,w:p.w,h:p.h})),name);
  if(blob&&gen===doc.gen){doc.pdf=blob;doc.pdfName=name;libSaveDoc().catch(e=>console.warn(e));}
}
async function waitPdf(){
  if(doc.pdf)return true;
  busy(true,t('preparing'));
  if(!working)working=runQueue();
  while(working&&!doc.pdf)await sleep(100);
  busy(false);return !!doc.pdf;
}

async function shareBlob(blob,name,onSent){
  const file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});onSent&&onSent();}

}

    DRIVE_ON&&{label:t('saveDrive'),fn:()=>{const go=async()=>{if(await saveBlobToDrive(pdf,r.name,r.id,go)){toast(t('savedTitle'));setTimeout(openLibrary,300);}};go();}},
    {label:t('del'),kind:'danger',fn:()=>sheet(t('delConfirm',r.name),t('phoneDelNote'),[{label:t('del'),kind:'danger',fn:async()=>{await libDel(r.id);if(doc.id===r.id)wipeDoc();toast(t('deleted'));openLibrary();}}])}
  ].filter(Boolean));
}
/* ---------- reopen a saved scan on the pages screen ---------- */
function editLib(r){
  flushUndo();wipeDoc();
  doc.id=r.id;doc.created=new Date(r.created);doc.fromLib=true;
  if(r.filter)doc.filter=r.filter;
  doc.customName=r.custom?r.name:null;doc.sent=!!r.sent;doc.saved=!!r.drive;
  doc.pages=r.pages.map(p=>({id:uid++,src:p.src||p.blob,
    quad:p.src&&p.quad?p.quad:[[0,0],[p.w,0],[p.w,p.h],[0,p.h]],rot:p.src?(p.rot||0):0,
    out:p.blob,w:p.w,h:p.h,thumb:URL.createObjectURL(p.blob)}));
  show('review');changed();
}

/* ---------- swipe a row: left = delete, right = rename ---------- */
function swipeRow(fg,onRename,onDelete){
  const row=document.createElement('div');row.className='swrow';
  const l=document.createElement('button');l.className='sa l';l.textContent=t('rename');
  const r=document.createElement('button');r.className='sa r';r.textContent=t('del');
  fg.classList.add('fg');row.append(l,r,fg);
  let x0=null,y0=0,dx=0,open=0,drag=false,moved=false;
  const set=v=>{open=v;fg.style.transform=v?`translateX(${v}px)`:'';};
  row._close=()=>set(0);
  fg.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;drag=false;moved=false;
    document.querySelectorAll('.swrow').forEach(o=>{if(o!==row&&o._close)o._close();});});
  fg.addEventListener('pointermove',e=>{
    if(x0===null)return;const ddx=e.clientX-x0,ddy=e.clientY-y0;
    if(!drag){if(Math.abs(ddx)>10&&Math.abs(ddx)>Math.abs(ddy)*1.2){drag=moved=true;fg.classList.add('drag');try{fg.setPointerCapture(e.pointerId);}catch(_){}}
      else if(Math.abs(ddy)>10){x0=null;return;}}
    if(drag){dx=Math.max(-150,Math.min(150,open+ddx));fg.style.transform=`translateX(${dx}px)`;}
  });
  const end=()=>{if(drag){fg.classList.remove('drag');set(dx<-60?-120:dx>60?120:0);}x0=null;drag=false;};
  fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',end);
  fg.addEventListener('click',e=>{if(moved||open){e.stopPropagation();e.preventDefault();if(!moved)set(0);moved=false;}},true);
  l.onclick=()=>{set(0);onRename();};r.onclick=()=>{set(0);onDelete();};
  return row;
}
/* ---------- delete with a few seconds to undo ---------- */
let undoState=null;
function undoable(msg,onUndo,onCommit){
  if(undoState){clearTimeout(undoState.t);undoState.commit();}
  const st={commit:onCommit,t:setTimeout(()=>{undoState=null;$('undoBar').classList.remove('on');onCommit();},5000)};
  undoState=st;$('undoText').textContent=msg;$('undoBtn').textContent=t('undo');$('undoBar').classList.add('on');
  $('undoBtn').onclick=()=>{clearTimeout(st.t);undoState=null;$('undoBar').classList.remove('on');onUndo();};
}
function flushUndo(){if(undoState){clearTimeout(undoState.t);const c=undoState.commit;undoState=null;$('undoBar').classList.remove('on');c();}}
/* ---------- rename ---------- */
function askName(current,onSave){
  const s_=$('sheet');s_.innerHTML='';
  const h=document.createElement('h3');h.textContent=t('renameTitle');s_.appendChild(h);
  const inp=document.createElement('input');inp.className='field';inp.style.marginTop='0';inp.value=current.replace(/\.pdf$/i,'');inp.autocapitalize='sentences';s_.appendChild(inp);
  const ok=document.createElement('button');ok.className='btn primary';ok.textContent=t('saveName');
  const no=document.createElement('button');no.className='btn secondary';no.textContent=t('cancel');

  s_.append(ok,no);$('sheetWrap').classList.add('on');setTimeout(()=>{inp.focus();inp.select();},50);

function renameLib(r){

function renameDrive(f){

let viewPdf=null,viewRec=null;
function openViewer(r,pdf){
  viewPdf=pdf;viewRec=r;show('viewer');$('viewTitle').textContent=r.name;
  const B=$('viewBody');B.innerHTML='';

/* =========================================================
   LIVE CAMERA (finds the page while you aim, snaps when steady)
   ========================================================= */
const live={stream:null,timer:null,replace:null,auto:ls('ps_auto')!=='0',last:null,stable:0,lost:0,armed:true,snap:null,busy:false,unavailable:false};
const lsmall=document.createElement('canvas'),ltiny=document.createElement('canvas');ltiny.width=ltiny.height=40;
async function startStream(){
  const tries=[{audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}},{audio:false,video:{facingMode:'environment'}},{audio:false,video:true}];
  for(const c of tries){try{live.stream=await navigator.mediaDevices.getUserMedia(c);break;}catch(e){live.stream=null;if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))break;}}
  if(!live.stream)return false;
  const tr=live.stream.getVideoTracks()[0];
  try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
  const v=$('vid');v.srcObject=live.stream;try{await v.play();}catch(e){}
  live.last=null;live.stable=0;live.lost=0;live.armed=true;return true;
}
function stopStream(){
  clearTimeout(live.timer);live.timer=null;
  if(live.stream){live.stream.getTracks().forEach(t_=>t_.stop());live.stream=null;}
  const v=$('vid');if(v)v.srcObject=null;
}
async function openCamera(replaceIndex=null){
  live.replace=replaceIndex;
  if(live.unavailable||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){openNativeCamera(replaceIndex);return;}
  const ok=await startStream();
  if(!ok){live.unavailable=true;toast(t('camFallback'));return;}
  if(!await needCv()){stopStream();return;}
  show('live');renderLive();liveLoop();
}
const LIVE={tick:40,frame:320,steady:4,move:0.02}; // camera speed: wait between checks (ms), check size (px), steady checks before snapping, allowed wobble
function liveLoop(){clearTimeout(live.timer);live.timer=setTimeout(liveTick,LIVE.tick);}
function tinyGray(src){const g=ltiny.getContext('2d',{willReadFrequently:true});g.drawImage(src,0,0,40,40);const d=g.getImageData(0,0,40,40).data,o=new Uint8Array(1600);for(let i=0;i<1600;i++)o[i]=(d[i*4]*3+d[i*4+1]*6+d[i*4+2])/10;return o;}
function liveTick(){
  if(!live.stream||cur!=='live')return;
  const v=$('vid');
  if(v.readyState>=2&&v.videoWidth&&!live.busy){
    const vw=v.videoWidth,vh=v.videoHeight,s=LIVE.frame/Math.max(vw,vh);
    lsmall.width=Math.round(vw*s);lsmall.height=Math.round(vh*s);
    lsmall.getContext('2d').drawImage(v,0,0,lsmall.width,lsmall.height);
    let q=null;try{q=findQuad(lsmall,true);if(q&&!looksLikePage(q,lsmall))q=null;}catch(e){}
    if(q){
      q=q.map(p=>[p[0]/lsmall.width,p[1]/lsmall.height]);
      if(live.last){
        const mv=Math.max(...q.map((p,i)=>Math.hypot(p[0]-live.last[i][0],p[1]-live.last[i][1])));
        live.stable=mv<LIVE.move?live.stable+1:0;
        if(mv<0.12)q=q.map((p,i)=>[live.last[i][0]*0.45+p[0]*0.55,live.last[i][1]*0.45+p[1]*0.55]);
      }
      live.last=q;live.lost=0;
      if(!live.armed&&live.snap){const n=tinyGray(lsmall);let d=0;for(let i=0;i<1600;i++)d+=Math.abs(n[i]-live.snap[i]);if(d/1600>20)live.armed=true;}
    }else{
      live.stable=0;live.lost++;
      if(live.lost>=3)live.last=null;
      if(live.lost>=4)live.armed=true;
    }
    drawLive();
    if(live.auto&&live.armed&&live.last&&live.stable>=LIVE.steady){capture();return;}
  }
  liveLoop();
}
// ignore false finds (table patterns): a page is brighter than its surroundings and does not span the whole frame
function looksLikePage(q,c){
  const W=c.width,H=c.height;
  if((q.some(p=>p[0]<W*0.02)&&q.some(p=>p[0]>W*0.98))||(q.some(p=>p[1]<H*0.02)&&q.some(p=>p[1]>H*0.98)))return false;
  const d=c.getContext('2d').getImageData(0,0,W,H).data,g=(x,y)=>{const i=(Math.min(H-1,Math.max(0,y|0))*W+Math.min(W-1,Math.max(0,x|0)))*4;return d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11;};
  let all=0,n=0;for(let y=0;y<H;y+=6)for(let x=0;x<W;x+=6){all+=g(x,y);n++;}all/=n;
  const [tl,tr,br,bl]=q;let inn=0,m=0;
  for(let v=0.2;v<=0.8;v+=0.05)for(let u=0.2;u<=0.8;u+=0.05){
    const x=(1-v)*((1-u)*tl[0]+u*tr[0])+v*((1-u)*bl[0]+u*br[0]),y=(1-v)*((1-u)*tl[1]+u*tr[1])+v*((1-u)*bl[1]+u*br[1]);inn+=g(x,y);m++;}
  return inn/m>all+8;
}
function sharpness(canvas){
  const cv=window.cv,t_=document.createElement('canvas'),s=480/Math.max(canvas.width,canvas.height);
  t_.width=Math.round(canvas.width*s);t_.height=Math.round(canvas.height*s);t_.getContext('2d').drawImage(canvas,0,0,t_.width,t_.height);
  const m=cv.imread(t_),g=new cv.Mat(),l=new cv.Mat(),mean=new cv.Mat(),sd=new cv.Mat();
  cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY);cv.Laplacian(g,l,cv.CV_64F);cv.meanStdDev(l,mean,sd);
  const v=sd.data64F[0];[m,g,l,mean,sd].forEach(x=>x.delete());return v;
}
function liveMap(){
  const v=$('vid'),r=$('live').getBoundingClientRect(),vw=v.videoWidth||1,vh=v.videoHeight||1,s=Math.max(r.width/vw,r.height/vh);
  return {s,ox:(r.width-vw*s)/2,oy:(r.height-vh*s)/2,vw,vh};
}
function drawLive(){
  const svg=$('liveOverlay');
  if(!live.last){svg.innerHTML='';}
  else{
    const m=liveMap();
    const pts=live.last.map(p=>[(m.ox+p[0]*m.vw*m.s).toFixed(1),(m.oy+p[1]*m.vh*m.s).toFixed(1)].join(',')).join(' ');
    const k=Math.min(1,live.stable/LIVE.steady),done=live.auto&&!live.armed;
    svg.innerHTML=`<polygon class="${done?'done':''}" style="${done?'':`fill:rgba(61,220,132,${(0.12+0.33*k).toFixed(2)});stroke-width:${(3+3*k).toFixed(1)}`}" points="${pts}"/>`;
  }
  $('liveHint').textContent=!live.last?t('camPoint'):!live.auto?t('camTap'):!live.armed?t('camNext'):t('camHold');
}
function renderLive(){
  const a=$('autoBtn');a.textContent=t('auto')+(live.auto?' ✓':'');a.classList.toggle('on',live.auto);
  const n=doc.pages.length,th=$('liveThumb'),last=doc.pages[n-1];
  th.hidden=!n||live.replace!==null;$('liveDone').hidden=!n||live.replace!==null;
  th.innerHTML=(last&&(last.thumb||last.preview)?`<img src="${last.thumb||last.preview}" alt="">`:'')+(n?`<span class="c">${n}</span>`:'');
  $('liveDone').textContent=t('done');
  drawLive();
}
async function capture(){
  if(live.busy||!live.stream)return;
  const v=$('vid');if(!v.videoWidth){liveLoop();return;}
  live.busy=true;
  const f=$('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),60);
  const vw=v.videoWidth,vh=v.videoHeight,s=Math.min(1,MAX_SRC/Math.max(vw,vh));
  // grab 3 frames and keep the sharpest one (less blur from a moving hand)
  let c=null,bestScore=-1;
  for(let k=0;k<3;k++){ // 3 quick frames, keep the sharpest
    const ck=document.createElement('canvas');ck.width=Math.round(vw*s);ck.height=Math.round(vh*s);
    ck.getContext('2d').drawImage(v,0,0,ck.width,ck.height);
    const sc=sharpness(ck);if(sc>bestScore){bestScore=sc;c=ck;}
    if(k<2)await sleep(40);
  }
  live.snap=tinyGray(c);live.armed=false;live.stable=0;
  let q=null;try{q=findQuad(c);}catch(e){}
  if(!q&&live.last)q=live.last.map(p=>[p[0]*c.width,p[1]*c.height]);
  if(!q)q=defaultQuad(c.width,c.height,0);
  const blob=await canvasToBlob(c,0.92);
  if(!doc.created)doc.created=new Date();
  if(live.replace!==null&&doc.pages[live.replace]){
    const p=doc.pages[live.replace];p.src=blob;p.quad=q;p.rot=0;p.out=null;
    live.busy=false;live.replace=null;show('review');changed();return;
  }
  const pv=document.createElement('canvas'),ps=120/Math.max(c.width,c.height);pv.width=Math.round(c.width*ps);pv.height=Math.round(c.height*ps);pv.getContext('2d').drawImage(c,0,0,pv.width,pv.height);
  doc.pages.push({id:uid++,src:blob,quad:q,rot:0,out:null,thumb:null,w:0,h:0,preview:pv.toDataURL('image/jpeg',0.7)});
  live.busy=false;changed();renderLive();liveLoop();
}
$('shutter').onclick=()=>capture();
$('autoBtn').onclick=()=>{live.auto=!live.auto;ls('ps_auto',live.auto?'1':'0');live.stable=0;renderLive();};
$('liveDone').onclick=$('liveThumb').onclick=()=>{show('review');renderReview();};
$('liveClose').onclick=()=>{const r=live.replace;live.replace=null;if(doc.pages.length){show('review');renderReview();}else{wipeDoc();goHome();}};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(live.stream)stopStream();}
  else if(cur==='live'&&!live.stream){startStream().then(ok=>{if(ok)liveLoop();else{show(doc.pages.length?'review':'home');}});}
});
window.addEventListener('resize',()=>{if(cur==='live')drawLive();});

/* =========================================================
   START
   ========================================================= */
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;ls('ps_lang',lang);if(doc.pdf&&doc.created&&doc.pages.length&&!doc.customName)doc.pdfName=fileName(doc.created);applyText();});
$('btnScan').onclick=()=>openCamera(null);
$('btnGallery').onclick=openGallery;
$('btnLibrary').onclick=openLibrary;
$('btnMyDrive').style.display=DRIVE_ON?'':'none';
applyText();
show('home');
libCleanup().catch(()=>{}).then(updateLibCount);
loadCv(); // start loading the scanner engine right away
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
